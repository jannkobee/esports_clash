server {
    listen 80;
    server_name _;
    client_max_body_size 16m;
    resolver 127.0.0.11 valid=10s;
    # Large GLBs use nginx's static path instead of Vite's Node stream. The
    # read-only mount still reflects model changes during local development.
    location ^~ /models/ {
        root /dev-public;
        try_files $uri =404;
        types { model/gltf-binary glb; application/json json; }
        add_header Cache-Control "no-cache";
    }
    location /live {
        set $match_upstream match-worker:8091;
        proxy_pass http://$match_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Origin $http_origin;
        proxy_read_timeout 90s;
    }
    location /backend/ {
        set $api_upstream api:8000;
        rewrite ^/backend/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
    location / {
        set $vite_upstream frontend-dev:5173;
        proxy_pass http://$vite_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
