# Add after compose.evolution.yaml. No database/artifact volumes are replaced.
x-dev-api: &dev-api
  environment:
    DEV_VITE_URL: http://localhost:8088
    TRELLIS_WORKER_URL: http://trellis-worker:8096
  extra_hosts:
    - "trellis-worker:host-gateway"
  volumes:
    - ./infrastructure/evolution/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    - ./EsportsClash.Api/app:/app/app:ro
    - ./EsportsClash.Api/bootstrap/app.php:/app/bootstrap/app.php:ro
    - ./EsportsClash.Api/config:/app/config:ro
    - ./EsportsClash.Api/database/migrations:/app/database/migrations:ro
    - ./EsportsClash.Api/routes:/app/routes:ro
    - ./EsportsClash.Api/resources/views:/app/resources/views:ro
    - ./EsportsClash.Api/resources/game:/app/resources/game:ro
    - ./infrastructure/trellis2/references:/app/resources/avatars/generation-references:ro
    - ./infrastructure/trellis2/reference-index.json:/app/resources/avatars/generation-reference-index.json:ro
    - ./EsportsClash.Api/resources/avatars/base-anatomy.json:/app/resources/avatars/base-anatomy.json:ro
    - ./EsportsClash.Api/resources/avatars/trellis2-colab.ipynb:/app/resources/avatars/trellis2-colab.ipynb:ro
    - ./.local-tools/trellis2/data/output:/app/storage/trellis-sources:rw
    - ./EsportsClash.Api/public:/app/public:ro
    - ./EsportsClash.Api/tests:/app/tests:ro

services:
  runner:
    # Development intelligence implementation; frozen legacy image tags remain available.
    image: teamfight-evolution-runner:arena-outcomes-v6
  trellis-worker:
    image: teamfight-trellis-worker:local
    build:
      context: ./infrastructure/trellis2
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8096:8096"
    volumes:
      - /home/wskdev18/.config/colab-cli:/root/.config/colab-cli:rw
      - ./infrastructure/trellis2:/app:ro
      - ./.local-tools/trellis2/data:/workspace/data:rw
      - ./EsportsClash.Api/storage:/workspace/storage:ro
    environment:
      TRELLIS_DATA: /workspace/data
      ASSET_WORKSPACE: /workspace
      TRELLIS_LOCAL_URL: http://trellis-native:8096
      TRELLIS_WORKER_TOKEN: ${EVOLUTION_WORKER_TOKEN:?Missing private worker token}
      COLAB_CLI: colab
    healthcheck:
      test: [CMD, python3, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8096/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  avatar-worker:
    volumes:
      - ./infrastructure/avatar-evolution/browser.mjs:/workspace/infrastructure/avatar-evolution/browser.mjs:ro
      - ./infrastructure/avatar-evolution/server.mjs:/workspace/infrastructure/avatar-evolution/server.mjs:ro
      - ./infrastructure/avatar-evolution/preparation-server.mjs:/workspace/infrastructure/avatar-evolution/preparation-server.mjs:ro
      - ./infrastructure/avatar-evolution/preparation-job.mjs:/workspace/infrastructure/avatar-evolution/preparation-job.mjs:ro
      - ./infrastructure/avatar-evolution/prepare-avatar.py:/workspace/infrastructure/avatar-evolution/prepare-avatar.py:ro
      - ./infrastructure/avatar-evolution/qualify-prepared.py:/workspace/infrastructure/avatar-evolution/qualify-prepared.py:ro
      - ./infrastructure/avatar-evolution/mesh_validation.py:/workspace/infrastructure/avatar-evolution/mesh_validation.py:ro
      - ./infrastructure/avatar-evolution/mesh_cleanup.py:/workspace/infrastructure/avatar-evolution/mesh_cleanup.py:ro
      - ./infrastructure/avatar-evolution/equipment_skin.py:/workspace/infrastructure/avatar-evolution/equipment_skin.py:ro
      - ./infrastructure/avatar-evolution/retarget_contacts.py:/workspace/infrastructure/avatar-evolution/retarget_contacts.py:ro
      - ./infrastructure/avatar-evolution/retarget_motion.py:/workspace/infrastructure/avatar-evolution/retarget_motion.py:ro
      - ./infrastructure/avatar-evolution/bone_mapping.py:/workspace/infrastructure/avatar-evolution/bone_mapping.py:ro
      - ./infrastructure/avatar-evolution/retarget-unirig.py:/workspace/infrastructure/avatar-evolution/retarget-unirig.py:ro
      - ./infrastructure/avatar-evolution/motion_intelligence.py:/workspace/infrastructure/avatar-evolution/motion_intelligence.py:ro
      - ./infrastructure/avatar-evolution/intelligence.mjs:/workspace/infrastructure/avatar-evolution/intelligence.mjs:ro
      - ./infrastructure/avatar-evolution/asset_pipeline:/workspace/infrastructure/avatar-evolution/asset_pipeline:ro
      - ./infrastructure/avatar-evolution/local_trial_source.py:/workspace/infrastructure/avatar-evolution/local_trial_source.py:ro

  api:
    <<: *dev-api
    command: [sh, -c, "php artisan migrate --force && exec php artisan serve --no-reload --host=0.0.0.0 --port=8000"]
    # PHP source reloads on every request. --no-reload avoids .env restarts;
    # Blade/browser reloads are driven by Vite, never APP_DEBUG trace output.

  worker:
    <<: *dev-api
    command: [php, artisan, 'queue:listen', '--sleep=3', '--timeout=30', '--tries=10']

  scheduler:
    <<: *dev-api

  avatar-queue-worker:
    <<: *dev-api
    command: [php, artisan, 'queue:listen', redis, '--queue=avatars', '--sleep=3', '--timeout=120', '--tries=4']

  frontend-dev:
    image: teamfight-evolution-frontend-dev:local
    build:
      context: .
      dockerfile: infrastructure/evolution/Dockerfile.dev
    environment:
      DOCKER_DEV: '1'
      VITE_API_URL: /backend/api/v1
    volumes:
      - ./EsportsClash.Web/src:/workspace/EsportsClash.Web/src:ro
      - ./EsportsClash.Web/public:/workspace/EsportsClash.Web/public:ro
      - ./EsportsClash.Web/index.html:/workspace/EsportsClash.Web/index.html:ro
      - ./EsportsClash.Web/vite.config.ts:/workspace/EsportsClash.Web/vite.config.ts:ro
      - ./EsportsClash.Web/avatar-review.html:/workspace/EsportsClash.Web/avatar-review.html:ro
      - ./EsportsClash.Api/app:/workspace/EsportsClash.Api/app:ro
      - ./EsportsClash.Api/bootstrap/app.php:/workspace/EsportsClash.Api/bootstrap/app.php:ro
      - ./EsportsClash.Api/resources/views:/workspace/EsportsClash.Api/resources/views:ro
      - ./EsportsClash.Api/public:/workspace/EsportsClash.Api/public:ro
      - ./EsportsClash.Api/routes:/workspace/EsportsClash.Api/routes:ro
      - ./EsportsClash.Api/config:/workspace/EsportsClash.Api/config:ro
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5173/@vite/client').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
    mem_limit: 1024m
    cpus: 1

  rooms:
    image: node:24-bookworm-slim
    working_dir: /workspace/EsportsClash.Web
    command: [node, --experimental-strip-types, server.mjs]
    environment:
      INTELLIGENCE_POLICY_URL: http://api:8000/api/v1/intelligence-policy
    volumes:
      - ./EsportsClash.Web:/workspace/EsportsClash.Web:ro
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1

  match-worker:
    image: teamfight-online-worker:painted-valley-v2

  web:
    volumes:
      - ./infrastructure/evolution/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ./EsportsClash.Web/public/models:/dev-public/models:ro
    depends_on:
      frontend-dev: {condition: service_healthy}

# ML, avatar generation and trusted online execution retain their frozen images.
# Rebuild/requalify those workers explicitly between runs, never during a study.
